name: CI
on:
  push:
    branches:
      - main
      - devel
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@41b7212b1668f5de9d65e9c82aa777e6bbedb3a8 # v2.1.4
        with:
          # Version range or exact version of a Python version to use, using Semver's version range syntax.
          # Using 3.8 due to https://github.com/PyCQA/pylint/issues/3882
          python-version:  3.8
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0

      - name: Install app
        run: pip install -e .
        
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Run linters
        run: |
          echo "::add-matcher::.github/python_problem_matchers.json"
          invoke lint

  promote:
    if: github.ref == 'refs/heads/devel'
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: Merge to master
        uses: devmasx/merge-branch@a1752b9ba42bb417ec19be7dc974e2faf77d3ef2 # v1.3.1
        with:
          type: now
          from_branch: devel
          target_branch: master
          github_token: ${{ github.token }}
